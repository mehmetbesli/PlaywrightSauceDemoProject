name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test Ortamı (Environment)'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - dev
          - staging
          - prod
      browser:
        description: 'Tarayıcı (Browser)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      workers:
        description: 'Paralel İş Parçacığı Sayısı (Workers)'
        required: true
        default: '2'
        type: string
      send_email:
        description: 'Test Sonuçlarını E-Posta ile Gönder (Send Email)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Execute Playwright Tests
        env:
          CI: true
          ENV: ${{ inputs.environment || 'qa' }}
          WORKERS: ${{ inputs.workers || '2' }}
          SEND_EMAIL: ${{ inputs.send_email || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          BROWSER_CHOICE="${{ inputs.browser || 'chromium' }}"
          if [ "$BROWSER_CHOICE" = "all" ]; then
            echo "Running tests on all browsers (Chromium, Firefox, WebKit)..."
            npx playwright test
          else
            echo "Running tests on $BROWSER_CHOICE..."
            npx playwright test --project=$BROWSER_CHOICE
          fi

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Excel Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-excel-report
          path: reports/excel/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Step & Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-logs
          path: reports/logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: reports/screenShot/
          retention-days: 30
          if-no-files-found: ignore
