name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test Ortamı (Environment)'
        required: true
        default: 'qa'
        type: choice
        options:
          - 'qa'
          - 'dev'
          - 'staging'
          - 'prod'
      browser:
        description: 'Tarayıcı Seçimi (Browser)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - 'chromium'
          - 'firefox'
          - 'webkit'
          - 'all'
      workers:
        description: 'Paralel Worker Sayısı (Workers)'
        required: false
        default: '2'
        type: string
      send_email:
        description: 'E-posta Bildirimi Gönderilsin mi?'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Playwright E2E Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      ENV: ${{ github.event.inputs.environment || 'qa' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      WORKERS: ${{ github.event.inputs.workers || '2' }}
      SEND_EMAIL: ${{ github.event.inputs.send_email || 'false' }}
      RETRIES: '2'
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🎭 Install Playwright Browsers with Dependencies
        run: |
          if [ "${{ github.event.inputs.browser }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ github.event.inputs.browser }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          elif [ "${{ github.event.inputs.browser }}" = "all" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: 🚀 Execute Playwright Tests
        run: |
          if [ "${{ github.event.inputs.browser }}" = "firefox" ]; then
            npx playwright test --project=firefox
          elif [ "${{ github.event.inputs.browser }}" = "webkit" ]; then
            npx playwright test --project=webkit
          elif [ "${{ github.event.inputs.browser }}" = "all" ]; then
            npx playwright test --project=chromium --project=firefox
          else
            npx playwright test --project=chromium
          fi

      - name: 📊 Upload HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-reports
          path: reports/html/
          retention-days: 30

      - name: 📈 Upload Excel Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-excel-reports
          path: reports/excel/
          retention-days: 30

      - name: 📸 Upload Screenshots (On Failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: reports/screenShot/
          retention-days: 30

      - name: 📝 Upload Run Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-logs
          path: reports/logs/
          retention-days: 30
